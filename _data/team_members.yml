  description: I coordinate our national research network- BioClocks UK. BioClocks UK is a hub for biological rhythms research in the UK, supporting researchers to deliver impact through stakeholder interactions, outreach, training, and resource production. Our research network meets in person at our bi-annual Clock Clubs where hundreds of academics from around the country come together to share their research, learn new skills, and connect with members of the community. 


